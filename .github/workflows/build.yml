name: Gerar executaveis

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 = base mais antiga disponivel, melhor compatibilidade com Windows 10
          - os: windows-2022
            nome: Windows
          - os: macos-latest
            nome: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Gerar executavel
        run: pyinstaller --onefile --clean --name ControleRemoto controle_remoto.py

      - name: Testar executavel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: dist/ControleRemoto.exe --teste

      - name: Renomear (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ControleRemoto.exe dist/ControleRemoto-Windows.exe

      - name: Compactar (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          chmod +x ControleRemoto
          zip ControleRemoto-macOS.zip ControleRemoto

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ControleRemoto-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.zip

      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
